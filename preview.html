<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge · Vista previa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--void:#0a0605;--ink:#f6e9da;--dim:#b49a82;--ember:#ff8a2a;--panel:rgba(20,12,8,.72);--line:#4a3022;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(transparent,rgba(10,6,5,.9) 40%)}
.cap{max-width:60ch;text-align:center;font-size:16px;line-height:1.5;min-height:3em;text-shadow:0 1px 6px #000}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font-family:"Chakra Petch",monospace;letter-spacing:.14em;text-transform:uppercase;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.go{background:var(--ember);color:#1a0b02;border-color:var(--ember);font-weight:600}
.tag{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-family:"Chakra Petch",monospace;letter-spacing:.3em;font-size:12px;color:var(--dim)}
.miss[hidden]{display:none}
.miss{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--dim)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="tag">FORGE · VISTA PREVIA</div>
<div class="miss" id="miss" hidden>Falta la imagen del enano (dwarf.jpg).</div>
<div class="ui">
  <div class="cap" id="cap">Toca “Hablar” para ver al enano platicar.</div>
  <div class="row">
    <button class="go" id="talk">Hablar</button>
    <button id="story">Historia corta</button>
  </div>
</div>
<script>
(() => {
  // Positions in the source image, as fractions of its width/height.
  const FACE = { mouthX: 0.44, mouthY: 0.33, jawRX: 0.19, jawTop: 0.325, jawBottom: 0.63, fireX: 0.82, fireY: 0.37 };
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const img = new Image(); img.src = 'dwarf.jpg';
  let ready = false, W = 0, H = 0, dpr = 1, t = 0, amp = 0, talking = false;
  let jaw = null; // offscreen soft-masked jaw layer
  img.onload = () => { ready = true; buildJaw(); };
  img.onerror = () => { document.getElementById('miss').hidden = false; };

  function size() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
  addEventListener('resize', size); size();

  function buildJaw() {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const c = document.createElement('canvas'); c.width = iw; c.height = ih;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    // soft mask: ellipse around the lower face and beard, fading at the edges
    const m = document.createElement('canvas'); m.width = iw; m.height = ih;
    const mg = m.getContext('2d');
    const cx = FACE.mouthX * iw, top = FACE.jawTop * ih, bot = FACE.jawBottom * ih;
    const cy = (top + bot) / 2, rx = FACE.jawRX * iw, ry = (bot - top) / 2;
    mg.save(); mg.translate(cx, cy); mg.scale(1, ry / rx);
    const grd = mg.createRadialGradient(0, 0, rx * 0.55, 0, 0, rx);
    grd.addColorStop(0, 'rgba(0,0,0,1)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
    mg.fillStyle = grd; mg.beginPath(); mg.arc(0, 0, rx, 0, Math.PI * 2); mg.fill(); mg.restore();
    // cut everything above the mouth line so the upper lip and nose stay put
    mg.globalCompositeOperation = 'destination-out';
    const fade = mg.createLinearGradient(0, top - ih * 0.01, 0, top + ih * 0.02);
    fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
    mg.fillStyle = fade; mg.fillRect(0, 0, iw, top + ih * 0.02);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(m, 0, 0);
    jaw = c;
  }

  // sparks
  const sparks = [];
  function spawn(fx, fy, scale) {
    if (sparks.length > 70) return;
    sparks.push({ x: fx + (Math.random() - .5) * 40 * scale, y: fy, vx: (Math.random() - .5) * .6, vy: -(0.6 + Math.random() * 1.6), life: 1, s: 1 + Math.random() * 2 });
  }

  function frame() {
    t += 1 / 60;
    // amplitude: real audio if available, otherwise a speech-like wobble while talking
    let target = 0;
    if (talking) {
      if (analyser) { analyser.getByteFrequencyData(buf); let s = 0; for (let i = 2; i < 40; i++) s += buf[i]; target = Math.min(1, s / 38 / 140); }
      else target = Math.max(0, Math.sin(t * 13) * 0.5 + Math.sin(t * 7.1) * 0.35 + 0.25) * (0.6 + 0.4 * Math.sin(t * 1.7));
    }
    amp += (target - amp) * 0.35;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0a0605'; ctx.fillRect(0, 0, W, H);
    if (ready) {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      // cover-fit, keep the face in view on narrow screens
      const breathe = 1 + Math.sin(t * 0.9) * 0.004;
      const wide = W / H > iw / ih;
      let sc, ox, oy;
      if (wide) {
        // fit the full height; fill the sides with a dark, blurred copy of the forge
        const bs = (W / iw) * 1.05, bw = iw * bs, bh = ih * bs;
        ctx.save(); try { ctx.filter = 'blur(18px) brightness(0.45)'; } catch {}
        ctx.drawImage(img, (W - bw) / 2, (H - bh) / 2, bw, bh); ctx.restore(); ctx.filter = 'none';
        ctx.fillStyle = 'rgba(10,6,5,0.35)'; ctx.fillRect(0, 0, W, H);
        sc = (H / ih) * breathe; ox = (W - iw * sc) / 2; oy = (H - ih * sc) / 2;
        const edge = ctx.createLinearGradient(ox, 0, ox + iw * sc, 0);
        ctx.drawImage(img, ox, oy, iw * sc, ih * sc);
        edge.addColorStop(0, 'rgba(10,6,5,0.9)'); edge.addColorStop(0.08, 'rgba(10,6,5,0)'); edge.addColorStop(0.92, 'rgba(10,6,5,0)'); edge.addColorStop(1, 'rgba(10,6,5,0.9)');
        ctx.fillStyle = edge; ctx.fillRect(ox - 1, 0, iw * sc + 2, H);
      } else {
        sc = Math.max(W / iw, H / ih) * 1.02 * breathe;
        const dw0 = iw * sc, dh0 = ih * sc;
        ox = W / 2 - dw0 * (FACE.mouthX + 0.06); ox = Math.min(0, Math.max(W - dw0, ox));
        oy = Math.min(0, Math.max(H - dh0, H * 0.36 - dh0 * FACE.mouthY));
        ctx.drawImage(img, ox, oy, dw0, dh0);
      }
      const dw = iw * sc, dh = ih * sc;

      // mouth opening: dark gap behind the jaw
      const mx = ox + FACE.mouthX * dw, my = oy + FACE.mouthY * dh;
      if (amp > 0.03) {
        ctx.fillStyle = `rgba(25,8,4,${Math.min(0.9, amp * 1.4)})`;
        ctx.beginPath(); ctx.ellipse(mx, my + 2 * sc, dw * 0.035, Math.max(1, amp * dh * 0.012), 0, 0, Math.PI * 2); ctx.fill();
      }
      // jaw + beard drop
      if (jaw) ctx.drawImage(jaw, ox, oy + amp * dh * 0.011, dw, dh * (1 + amp * 0.006));

      // fire light: flicker on the hearth and warm spill on the dwarf
      const fx = ox + FACE.fireX * dw, fy = oy + FACE.fireY * dh;
      const flick = 0.75 + 0.15 * Math.sin(t * 9.3) + 0.1 * Math.sin(t * 23.1) + (talking ? amp * 0.25 : 0);
      ctx.globalCompositeOperation = 'lighter';
      let g = ctx.createRadialGradient(fx, fy, 0, fx, fy, dw * 0.22);
      g.addColorStop(0, `rgba(255,140,40,${0.28 * flick})`); g.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      g = ctx.createRadialGradient(fx, fy, 0, fx, fy, dw * 0.75);
      g.addColorStop(0, `rgba(255,120,40,${0.07 * flick})`); g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      // sparks rising from the forge
      if (Math.random() < 0.35 + amp * 0.5) spawn(fx, fy + dh * 0.04, sc);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.x += p.vx + Math.sin(t * 3 + i) * 0.25; p.y += p.vy; p.life -= 0.012;
        if (p.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(255,${150 + 80 * p.life | 0},60,${p.life})`;
        ctx.fillRect(p.x, p.y, p.s, p.s);
      }
      ctx.globalCompositeOperation = 'source-over';
      // vignette
      g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.8);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- voice: uses the same ElevenLabs settings saved in Forge (same site) ----
  const get = k => { try { return localStorage.getItem('forge.' + k) || ''; } catch { return ''; } };
  let actx = null, analyser = null, buf = null, audio = null;
  function setupAudio() {
    if (audio) return;
    audio = new Audio(); audio.playsInline = true;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaElementSource(audio);
      const an = actx.createAnalyser(); an.fftSize = 256; buf = new Uint8Array(an.frequencyBinCount);
      src.connect(an); an.connect(actx.destination); window.__an = an;
    } catch {}
  }
  const cap = document.getElementById('cap');
  async function say(text) {
    setupAudio(); cap.textContent = text;
    const key = get('elKey'), voice = get('elVoice'), speed = Number(get('speed')) || 0.85;
    if (key && voice) {
      try {
        cap.textContent = '…';
        const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voice)}?output_format=mp3_44100_128`, {
          method: 'POST', headers: { 'xi-api-key': key, 'content-type': 'application/json', accept: 'audio/mpeg' },
          body: JSON.stringify({ text, model_id: 'eleven_multilingual_v2', voice_settings: { stability: 0.5, similarity_boost: 0.75, speed } })
        });
        if (!r.ok) throw new Error('ElevenLabs ' + r.status);
        audio.src = URL.createObjectURL(await r.blob());
        if (actx?.state === 'suspended') await actx.resume();
        analyser = window.__an || null; talking = true; cap.textContent = text;
        audio.onended = () => { talking = false; analyser = null; };
        await audio.play(); return;
      } catch (e) { cap.textContent = text + '  (ElevenLabs no respondió: ' + e.message + ')'; }
    }
    analyser = null;
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang = 'es-MX'; u.rate = speed; u.pitch = 0.7;
      u.onstart = () => talking = true; u.onend = u.onerror = () => talking = false;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch { talking = true; setTimeout(() => talking = false, 4000); }
  }
  document.getElementById('talk').onclick = () => say('¡Por mi barba, lad! Bienvenido a la forja. El fuego está encendido y el yunque listo. ¿Qué batalla damos hoy?');
  document.getElementById('story').onclick = () => say('Escucha, lad. Hace mucho, bajo la Montaña Solitaria, mis ancestros guardaban un tesoro tan grande que hasta un dragón lo quiso. Pero eso, muchacho, es historia para otra pinta de cerveza.');
})();
</script>
</body>
</html>
